name: diag-susfs
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (con submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Info kernel + KSU
        run: |
          echo "=== kernel version ==="
          make kernelversion 2>/dev/null || grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile | head -4
          echo "=== KSU submodule ==="
          git -C KernelSU rev-parse HEAD || true
          grep -m1 'KSU_VERSION=' KernelSU/kernel/Makefile || true
          echo "--- refs a susfs en KSU Kconfig (0 = no soporta nativo) ---"
          grep -ci 'susfs' KernelSU/kernel/Kconfig || echo 0

      - name: Traer susfs4ksu (kernel-4.19)
        run: |
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs
          grep -m1 SUSFS_VERSION /tmp/susfs/kernel_patches/include/linux/susfs.h

      - name: Copiar archivos nuevos susfs (fs + include)
        run: |
          cp /tmp/susfs/kernel_patches/fs/* fs/
          cp /tmp/susfs/kernel_patches/include/linux/* include/linux/
          ls -1 fs/susfs.c fs/sus_su.c include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h

      - name: Probar 10_enable sobre KernelSU
        run: |
          set +e
          cp /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch > ../ksu_patch.log 2>&1
          echo "KSU_PATCH_RC=$?" | tee -a ../ksu_patch.log
          cd ..
          find KernelSU -name '*.rej' > ksu_rej.txt 2>/dev/null
          echo "KSU rejects: $(wc -l < ksu_rej.txt)"

      - name: Probar 50_add sobre raiz del kernel
        run: |
          set +e
          cp /tmp/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          patch -p1 --no-backup-if-mismatch < 50_add_susfs_in_kernel-4.19.patch > main_patch.log 2>&1
          echo "MAIN_PATCH_RC=$?" | tee -a main_patch.log
          find fs include kernel -name '*.rej' > main_rej.txt 2>/dev/null
          echo "MAIN rejects: $(wc -l < main_rej.txt)"

      - name: Resumen en consola
        if: always()
        run: |
          echo "########## KSU patch log ##########"; cat ksu_patch.log 2>/dev/null
          echo "########## MAIN patch log ##########"; cat main_patch.log 2>/dev/null
          echo "########## KSU rejects ##########"; cat ksu_rej.txt 2>/dev/null
          echo "########## MAIN rejects ##########"; cat main_rej.txt 2>/dev/null

      - name: Recolectar rechazos y logs
        if: always()
        run: |
          mkdir -p _diag
          cp ksu_patch.log main_patch.log ksu_rej.txt main_rej.txt _diag/ 2>/dev/null || true
          find . -name '*.rej' -not -path './.git/*' -not -path '/tmp/*' -exec cp --parents {} _diag/ \; 2>/dev/null || true

      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-susfs
          path: _diag/**
          if-no-files-found: warn
