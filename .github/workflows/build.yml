name: build-kernel

on:
  workflow_call:
    inputs:
      device:
        type: string
        required: true
      profile:
        type: string
        required: false
        default: safe

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    env:
      DEVICE: ${{ inputs.device }}
      SUSFS_PROFILE: ${{ inputs.profile }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build kernel
        run: ./build.sh

      - name: Verify source and package
        run: |
          set -euo pipefail
          zip_file=$(find . -maxdepth 1 -name "YivasKernel-${DEVICE}-SUSFS-v2-${SUSFS_PROFILE}-*.zip" -print -quit)
          test -n "$zip_file"
          unzip -Z1 "$zip_file" > zip-files.txt
          grep -qx 'Image' zip-files.txt
          grep -qx 'anykernel.sh' zip-files.txt
          ! grep -Eq '(^|/)(dtbo|vbmeta)(\.img)?$' zip-files.txt
          ! grep -Eq 'flash_generic|patch_cmdline|/by-name/(dtbo|vbmeta)' packaging/anykernel.sh
          grep -a -i -q 'kernelsu' out/arch/arm64/boot/Image
          grep -a -i -q 'susfs' out/arch/arm64/boot/Image
          sha256sum "$zip_file" out/arch/arm64/boot/Image > SHA256SUMS
          cp out/.config kernel.config
          echo "zip_file=$zip_file" >> "$GITHUB_ENV"

      - name: Upload audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YivasKernel-r8q-SUSFS-v2-${{ inputs.profile }}-${{ github.sha }}
          path: |
            ${{ env.zip_file }}
            out/arch/arm64/boot/Image
            kernel.config
            SHA256SUMS
            zip-files.txt
          retention-days: 14
          if-no-files-found: error
