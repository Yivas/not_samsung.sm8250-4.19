name: Prepare Extra dim pair (NO-FLASH)

on:
  workflow_call:

permissions:
  contents: read

env:
  CONTROL_SHA: b00864ce2ed12e909b00f14486fc5a3e794b9733
  CANDIDATE_SHA: eb8b09307137e78b14710b88b5c310b7938e6825
  DEVICE: r8q
  SUSFS_PROFILE: safe
  VERIFIER_SHA256: 661c42fc500989971d40263809a48e98ecd7d31dcfcced4f879054d4299787c6

jobs:
  build-pair:
    name: Build control and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: orchestrator
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false

      - name: Verify trusted workflow source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/susfs-v2-safe'
          test "$(sha256sum orchestrator/ci/extra-dim-pair.sh | awk '{print $1}')" = \
               "$VERIFIER_SHA256"
          test "$(git -C orchestrator rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Verify source pair
        run: |
          set -euo pipefail
          mkdir -p results/source
          bash orchestrator/ci/extra-dim-pair.sh source orchestrator results/source
          cat results/source/SOURCE-VERIFICATION.txt

      - name: Create independent source clones
        run: |
          set -euo pipefail
          mkdir -p work
          source_repo=$(git -C orchestrator remote get-url origin)
          git clone --no-local --no-checkout orchestrator work/control
          git clone --no-local --no-checkout orchestrator work/candidate
          git -C work/control remote set-url origin "$source_repo"
          git -C work/candidate remote set-url origin "$source_repo"
          git -C work/control checkout --detach "$CONTROL_SHA"
          git -C work/candidate checkout --detach "$CANDIDATE_SHA"
          git -C work/control submodule update --init --recursive
          git -C work/candidate submodule update --init --recursive
          test "$(git -C work/control rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git -C work/candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C work/control status --porcelain --untracked-files=no)"
          test -z "$(git -C work/candidate status --porcelain --untracked-files=no)"

      - name: Build control A
        working-directory: work/control
        run: |
          set -euo pipefail
          test ! -e tc
          ./build.sh 2>&1 | tee build.log

      - name: Archive control A
        run: |
          set -euo pipefail
          bash orchestrator/ci/extra-dim-pair.sh archive \
            work/control control-a "$CONTROL_SHA" results/control-a

      - name: Rebuild control B
        working-directory: work/control
        run: |
          set -euo pipefail
          clang_before=$(sha256sum tc/clang/bin/clang | awk '{print $1}')
          rm -rf out AnyKernel3
          find . -maxdepth 1 -type f \
            -name 'YivasKernel-r8q-SUSFS-v2-safe-*.zip' -delete
          ./build.sh 2>&1 | tee build.log
          clang_after=$(sha256sum tc/clang/bin/clang | awk '{print $1}')
          test "$clang_before" = "$clang_after"

      - name: Archive control B
        run: |
          set -euo pipefail
          bash orchestrator/ci/extra-dim-pair.sh archive \
            work/control control-b "$CONTROL_SHA" results/control-b

      - name: Build candidate with the verified control toolchain
        working-directory: work/candidate
        run: |
          set -euo pipefail
          test ! -e tc
          mkdir -p tc
          ln -s "$(realpath ../control/tc/clang)" tc/clang
          test "$(sha256sum tc/clang/bin/clang | awk '{print $1}')" = \
               "$(sha256sum ../control/tc/clang/bin/clang | awk '{print $1}')"
          ./build.sh 2>&1 | tee build.log

      - name: Archive candidate
        run: |
          set -euo pipefail
          bash orchestrator/ci/extra-dim-pair.sh archive \
            work/candidate candidate "$CANDIDATE_SHA" results/candidate

      - name: Compare pair and remove flashable packages
        run: |
          set -euo pipefail
          bash orchestrator/ci/extra-dim-pair.sh compare \
            results/control-a results/control-b results/candidate results
          {
            printf 'EXTRA DIM DIAGNOSTIC ARTIFACT\n'
            printf 'This artifact does not contain a flashable ZIP.\n'
            printf 'Dry-run and human approval are still required.\n'
            printf 'control=%s\n' "$CONTROL_SHA"
            printf 'candidate=%s\n' "$CANDIDATE_SHA"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
          } > results/NO-FLASH.txt
          sha256sum results/NO-FLASH.txt >> results/COMPARISON-SHA256SUMS
          rm results/control-a/kernel.zip \
             results/control-b/kernel.zip \
             results/candidate/kernel.zip
          test -z "$(find results -type f -name 'kernel.zip' -print -quit)"
          cat results/COMPARISON-MANIFEST.txt

      - name: Upload non-flashable audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NO-FLASH-extra-dim-${{ env.CONTROL_SHA }}-${{ env.CANDIDATE_SHA }}
          path: results/
          retention-days: 14
          if-no-files-found: error
